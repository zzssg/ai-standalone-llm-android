plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// Signing credentials live outside the repository. When keystore.properties is
// absent -- on a fresh clone, or in CI without secrets -- the release build
// simply produces an unsigned APK instead of failing.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'org.zzssg.llmchatapp'
    compileSdk 36

    // Pinned so the native build is reproducible across machines. Without this,
    // AGP silently uses whatever its own default NDK is, which changes on every
    // AGP upgrade -- and a different NDK means a different libc++ and different
    // codegen for ggml. If SDK Manager installed a different patch revision,
    // change this one line to match it exactly.
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId "org.zzssg.llmchatapp"
        // 26 rather than 24: the NDK dropped API 24 support some releases ago,
        // and llama.cpp's C++17 usage needs a modern libc++ anyway.
        minSdk 26
        targetSdk 36
        versionCode 13
        versionName "2.6.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_shared"
                // Opt in to an ARMv8.2 baseline with
                //   ./gradlew assembleRelease -PllmCpuArch=armv8.2-a+dotprod+fp16
                // See the comment in src/main/cpp/CMakeLists.txt for the tradeoff.
                if (project.hasProperty('llmCpuArch')) {
                    arguments "-DLLM_CPU_ARCH=${project.property('llmCpuArch')}"
                }
            }
        }

        // 64-bit ARM only. Every current Android phone is arm64-v8a; adding
        // armeabi-v7a would double build time for devices that cannot hold a
        // usable model in memory anyway. The debug variant adds x86_64 on top of
        // this -- see the buildTypes block.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            if (keystoreProperties.containsKey('storeFile')) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                // v1 is only needed below API 24; minSdk is 26.
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            // Note: the debug variant compiles ggml without optimisation, which
            // is roughly an order of magnitude slower per token. Benchmark and
            // demo with `assembleRelease`, not `assembleDebug`.
            minifyEnabled false

            // x86_64 exists so the app can run on a desktop emulator, which is
            // how the instrumented tests verify multi-turn behaviour without
            // physical hardware. AGP unions these with defaultConfig, so debug
            // builds arm64-v8a + x86_64 while release stays arm64-v8a only.
            //
            // Emulator timings are meaningless -- this ABI is for correctness,
            // never for benchmarking.
            ndk {
                abiFilters 'x86_64'
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreProperties.containsKey('storeFile')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        // Targeting 17 rather than requesting a toolchain: jvmToolchain(17) makes
        // Gradle demand a JDK 17 specifically, which fails on a machine that only
        // has a newer JDK. Setting the target instead builds correctly on any
        // JDK 17 or later, including the 21 that current Android Studio bundles.
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packagingOptions {
        jniLibs {
            // Loading the shared library straight from the APK saves ~40 MB of
            // duplicated install footprint on API 23+.
            useLegacyPackaging false
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        // ChromeOS wants an x86_64 slice. Shipping arm64 only is deliberate: see
        // the abiFilters comment above.
        disable 'ChromeOsAbiSupport'
        // Treat everything else as blocking, so the next eight-month gap cannot
        // quietly accumulate correctness warnings.
        warningsAsErrors true
        abortOnError true
        // Dependency-freshness advice is informational and currently blocked on
        // an AGP/compileSdk 37 upgrade; see the note in the dependencies block.
        informational 'GradleDependency', 'NewerVersionAvailable', 'AndroidGradlePluginVersion'
    }
}

dependencies {
    // NOTE: androidx lint will report newer versions of everything below. Do not
    // take that advice piecemeal -- Compose BOM 2026.08.00, core-ktx 1.19.0 and
    // lifecycle 2.11.0 all declare `compileSdkVersion 37` in their AAR metadata,
    // and AGP 8.13 caps out at compileSdk 36. Moving up means bumping AGP,
    // installing the android-37 platform and raising compileSdk, as one change.
    def composeBom = platform('androidx.compose:compose-bom:2025.09.00')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4'

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
