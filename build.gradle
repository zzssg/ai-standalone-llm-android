plugins {
    id 'com.android.application' version '8.13.0' apply false
    id 'org.jetbrains.kotlin.android' version '2.2.20' apply false
    // Required from Kotlin 2.0 on: the Compose compiler ships with Kotlin
    // itself, so the old composeOptions.kotlinCompilerExtensionVersion pin is
    // gone and version skew between the two is no longer possible.
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.20' apply false
}
